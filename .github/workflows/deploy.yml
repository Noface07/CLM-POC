name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run selftest

      # The Salesforce org and the Connected App's consumer key are baked into the bundle
      # at build time (Vite's VITE_ variables). .env is gitignored, so CI reads them from
      # the repository's Actions variables instead: Settings → Secrets and variables →
      # Actions → Variables. Neither is a secret — the key belongs to a PKCE public
      # client — which is why they are variables rather than secrets and may appear in
      # logs. Leave them unset and the deployed demo runs in simulated mode.
      - run: npm run build
        env:
          VITE_SALESFORCE_URL: ${{ vars.VITE_SALESFORCE_URL }}
          VITE_SF_CLIENT_ID: ${{ vars.VITE_SF_CLIENT_ID }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
